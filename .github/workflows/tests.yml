# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - name: Build bottles for changed formulae (excluding calm)
        if: github.event_name == 'pull_request'
        run: |
          TAP_DIR="$(brew --repo quirkdom/tap)"
          git -C "$TAP_DIR" fetch origin "${GITHUB_BASE_REF:-main}" --depth=1 || true
          FORMULAE=$(git -C "$TAP_DIR" diff --name-only "origin/${GITHUB_BASE_REF:-main}...HEAD" Formula/ | sed -E 's|^Formula/(.*)\.rb$|\1|' | grep -v '^calm$' || true)
          if [[ -n "$FORMULAE" ]]; then
            FORMULAE_LIST=$(echo "$FORMULAE" | paste -sd, -)
            echo "Building bottles for: $FORMULAE_LIST"
            brew test-bot --only-formulae --testing-formulae="$FORMULAE_LIST"
          else
            echo "No formulae to test/bottle (calm is excluded)."
          fi

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: ignore
